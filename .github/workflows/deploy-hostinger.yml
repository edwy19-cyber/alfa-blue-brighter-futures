name: Build website for Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-hostinger
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Configure static build
        run: cp .github/static/vite.config.ts vite.config.ts

      - name: Build website
        run: bun run build

      - name: Add Hostinger configuration
        run: |
          cat > .output/public/.htaccess <<'EOF'
          Options -MultiViews
          DirectorySlash On
          DirectoryIndex index.html

          RewriteEngine On
          RewriteCond %{HTTP_HOST} ^www\.alfablueme\.com$ [NC]
          RewriteRule ^(.*)$ https://alfablueme.com/$1 [R=301,L]

          RedirectMatch 301 ^/impact/?$ /approach
          RedirectMatch 301 ^/sponsor/?$ /how-sponsorship-works
          EOF

      - name: Publish built website to Hostinger branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger
          publish_dir: ./.output/public
          force_orphan: true
